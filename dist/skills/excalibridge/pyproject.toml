[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excalibridge"
dynamic = ["version"]
description = "A shared Excalidraw canvas between you and your coding agent, with a send button that wakes the agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "rheech22" }]
keywords = ["excalidraw", "agent", "claude-code", "codex", "whiteboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rheech22/excalibridge"
Changelog = "https://github.com/rheech22/excalibridge/blob/main/CHANGELOG.md"

[project.scripts]
excalibridge = "excalibridge.cli:main"
xb = "excalibridge.cli:main"

[tool.hatch.version]
path = "excalibridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["excalibridge"]

[tool.hatch.build.targets.sdist]
include = ["excalibridge", "tests", "README.md", "CHANGELOG.md", "LICENSE", "SKILL.md", "references", "herdr-plugin", "examples"]
