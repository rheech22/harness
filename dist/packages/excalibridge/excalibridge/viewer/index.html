<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>excalibridge</title>
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css">
<style>
  html, body { margin: 0; height: 100%; }
  #app { height: 100%; width: 100%; }
  .xb-ui { display: flex; align-items: center; gap: 8px; font: 13px system-ui; }
  .xb-ui .status { color: var(--color-gray-60, #666); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xb-ui button { height: 36px; width: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid var(--color-primary, #6965db); background: var(--color-primary, #6965db); color: #fff; cursor: pointer; }
  .xb-ui button:hover { background: var(--color-primary-darker, #5b57d1); }
  .xb-ui button:disabled { opacity: .55; cursor: default; }
  .xb-ui button.idle { background: var(--island-bg-color, #fff); color: var(--color-gray-50, #999); border-color: var(--default-border-color, #ddd); opacity: 1; cursor: help; }
  .xb-ui button svg { width: 18px; height: 18px; display: block; }
  .xb-ui button.busy svg { animation: xb-fly .8s ease-in-out infinite; }
  @keyframes xb-fly { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -3px); } }
  #xb-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font: 14px system-ui; color: #b00; padding: 24px; text-align: center; }
</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@19.0.0","react/jsx-runtime":"https://esm.sh/react@19.0.0/jsx-runtime",
"react-dom":"https://esm.sh/react-dom@19.0.0","react-dom/client":"https://esm.sh/react-dom@19.0.0/client"}}
</script>
</head>
<body>
<div id="app"></div>
<div id="xb-error"></div>
<script>window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";</script>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { localEmbedURL } from "/_excalibridge/embeddable.mjs";

const API = "/_excalibridge/";
const params = new URLSearchParams(location.search);
const file = (params.get("file") || "").replace(/^\/+/, "");
const showError = (msg) => { const el = document.getElementById("xb-error"); el.style.display = "flex"; el.textContent = msg; };
if (!file) showError("Open this viewer with ?file=<path/to/file.excalidraw> relative to the project root.");

const { Excalidraw, convertToExcalidrawElements, serializeAsJSON } =
  await import("https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom");
window.convertToExcalidrawElements = convertToExcalidrawElements;
window.serializeAsJSON = serializeAsJSON;

const q = (op) => API + op + "?file=" + encodeURIComponent(file);
const snap = (els) => new Map(els.filter(e => !e.isDeleted).map(e => [e.id, e.version]));
let savedSnapshot = new Map();   // what the file on disk holds (as far as this tab knows)
let loadedMtime = null;
let api = null;

const setStatus = (t) => { const el = document.getElementById("xb-status"); if (el) el.textContent = t; };
let busyNow = false, serverPending = 0;
const pendingCount = () => (api ? window.unsavedChanges().count : 0) + serverPending;
let idleReason = "";
const renderSendState = () => {
  const b = document.getElementById("xb-send"); if (!b) return;
  const unsaved = api ? window.unsavedChanges().count : 0;
  const idle = !busyNow && unsaved + serverPending === 0;
  // Keep the button clickable when idle so hovering and clicking can explain why nothing will be sent.
  b.disabled = busyNow;
  b.setAttribute("aria-disabled", String(idle));
  b.classList.toggle("busy", busyNow);
  b.classList.toggle("idle", idle);
  idleReason = idle ? "Nothing to send: the agent has already seen everything on this canvas." : "";
  b.title = busyNow ? "Sending…"
    : idle ? idleReason + " Draw or write something, or Shift+click to send anyway."
    : `Send to agent · ${serverPending} change(s) unseen by the agent${unsaved ? `, ${unsaved} unsaved` : ""} (Cmd/Ctrl+Enter)`;
  if (!busyNow && !statusPinnedUntil || Date.now() > statusPinnedUntil) {
    setStatus(idle ? "Agent is caught up" : `${serverPending + unsaved} change(s) to send`);
  }
};
let statusPinnedUntil = 0;
const pinStatus = (t, ms = 4000) => { setStatus(t); statusPinnedUntil = Date.now() + ms; };
const setBusy = (busy) => { busyNow = busy; renderSendState(); };
const refreshServerPending = async () => {
  if (!file) return;
  try { serverPending = (await (await fetch(q("changes"))).json()).count || 0; } catch {}
  renderSendState();
};

// ---------------------------------------------------------------- load
const FRAME_RENDERING = { enabled: true, name: false, outline: false, clip: false };
let initialData = { elements: [], appState: { viewBackgroundColor: "#ffffff", frameRendering: FRAME_RENDERING } };
if (file) {
  const r = await fetch("/" + file + "?t=" + Date.now());
  if (r.ok) {
    const j = await r.json();
    initialData = { elements: j.elements || [], appState: { viewBackgroundColor: j.appState?.viewBackgroundColor || "#ffffff", frameRendering: FRAME_RENDERING }, scrollToContent: true };
  } else {
    showError("Could not load " + file + " (" + r.status + "). The server serves the project root; the path is root-relative.");
  }
}

// ---------------------------------------------------------------- unsaved / seen
const diffAgainst = (base) => {
  const els = api.getSceneElements();
  const byId = new Map(els.map(e => [e.id, e]));
  const added = [], modified = [], removed = [];
  for (const e of els) {
    if (e.isDeleted) continue;
    if (!base.has(e.id)) added.push(e); else if (base.get(e.id) !== e.version) modified.push(e);
  }
  for (const id of base.keys()) if (!byId.has(id) || byId.get(id).isDeleted) removed.push(id);
  return { added, modified, removed, count: added.length + modified.length + removed.length };
};
window.unsavedChanges = () => diffAgainst(savedSnapshot);

// ---------------------------------------------------------------- save / send
const refreshMtime = async () => { try { loadedMtime = (await (await fetch(q("mtime"))).json()).mtime; } catch {} };

window.saveScene = async () => {
  try {
    const { mtime } = await (await fetch(q("mtime"))).json();
    if (loadedMtime !== null && mtime !== loadedMtime) { await pollFile(); }
  } catch {}
  const json = serializeAsJSON(api.getSceneElements(), api.getAppState(), api.getFiles(), "local");
  const r = await fetch(q("save"), { method: "POST", headers: { "Content-Type": "application/json" }, body: json });
  const out = await r.json();
  if (out.ok) { savedSnapshot = snap(api.getSceneElements()); await refreshMtime(); pinStatus("Saved " + new Date().toLocaleTimeString(), 2000); refreshServerPending(); }
  return out;
};

let sending = false, cooldownUntil = 0;
window.sendScene = async (note = "", { force = false } = {}) => {
  if (sending) return { ok: false, skipped: "sending" };
  if (!force && Date.now() < cooldownUntil) { pinStatus("Just sent. Wait a moment."); return { ok: false, skipped: "cooldown" }; }
  sending = true; setBusy(true);
  try {
    clearTimeout(autosaveTimer);
    if (window.unsavedChanges().count > 0) await window.saveScene();
    let changes = 0;
    try { changes = (await (await fetch(q("changes"))).json()).count || 0; } catch {}
    if (!force && changes === 0 && !note) { pinStatus("Nothing new for the agent. Shift+click to send anyway."); return { ok: false, skipped: "nochange" }; }
    const scene = JSON.parse(serializeAsJSON(api.getSceneElements(), api.getAppState(), api.getFiles(), "local"));
    const r = await fetch(q("send"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scene, note, changes }) });
    const out = await r.json();
    if (out.ok) {
      savedSnapshot = snap(api.getSceneElements()); await refreshMtime(); cooldownUntil = Date.now() + 8000; serverPending = 0; renderSendState();
      const failed = (out.results || []).filter(x => !x.ok && x.type !== "inbox").map(x => x.type);
      pinStatus("Sent " + new Date().toLocaleTimeString() + " (" + changes + " changed)" + (failed.length ? " · failed: " + failed.join(", ") : ""), 6000);
    }
    return out;
  } finally { sending = false; setBusy(false); }
};

// ---------------------------------------------------------------- autosave + external reload
let autosaveTimer = null;
const scheduleAutosave = () => {
  if (!file) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(async () => {
    if (!api) return;
    if (api.getAppState().editingTextElement) return scheduleAutosave();
    if (window.unsavedChanges().count === 0) return;
    try { await window.saveScene(); } catch (e) { pinStatus("Autosave failed: " + e, 8000); }
  }, 1500);
};

async function pollFile() {
  if (!file || !api) return;
  try {
    const { mtime } = await (await fetch(q("mtime"))).json();
    if (loadedMtime === null) { loadedMtime = mtime; return; }
    if (mtime === loadedMtime) return;
    if (api.getAppState().editingTextElement) return;
    const j = await (await fetch("/" + file + "?t=" + Date.now())).json();
    const local = window.unsavedChanges();
    let merged = j.elements;
    if (local.count > 0) {
      // Keep this tab's unsaved edits on top of what changed on disk (the agent edits other elements).
      const mine = new Map([...local.added, ...local.modified].map(e => [e.id, e]));
      const gone = new Set(local.removed);
      merged = j.elements.filter(e => !gone.has(e.id)).map(e => mine.has(e.id) ? mine.get(e.id) : e);
      for (const e of local.added) if (!j.elements.some(x => x.id === e.id)) merged.push(e);
    }
    api.updateScene({ elements: merged });
    savedSnapshot = snap(j.elements); loadedMtime = mtime;
    pinStatus(local.count > 0 ? "Merged changes from disk with your edits" : "Reloaded " + new Date().toLocaleTimeString(), 2000);
    refreshServerPending();
    if (local.count > 0) scheduleAutosave();
  } catch {}
}
setInterval(pollFile, 3000);
setInterval(refreshServerPending, 3000);

// ---------------------------------------------------------------- UI
const TopRightUI = () => React.createElement("div", { className: "xb-ui" },
  React.createElement("span", { id: "xb-status", className: "status" }, file || "no file"),
  React.createElement("button", { id: "xb-send", title: "Send to agent (Cmd/Ctrl+Enter; Shift+click forces)", "aria-label": "Send",
      onClick: (e) => { if (idleReason && !e.shiftKey) { pinStatus(idleReason + " Shift+click sends anyway."); return; }
                        window.sendScene("", { force: e.shiftKey }).catch(err => pinStatus("Send failed: " + err)); } },
    React.createElement("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
      React.createElement("path", { d: "M22 2L11 13" }),
      React.createElement("path", { d: "M22 2L15 22L11 13L2 9L22 2Z" }))));

document.addEventListener("keydown", (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;
  if (e.key === "s") { e.preventDefault(); window.saveScene(); }
  if (e.key === "Enter") { e.preventDefault(); window.sendScene("", { force: e.shiftKey }); }  // Shift forces even when idle
});

createRoot(document.getElementById("app")).render(React.createElement(Excalidraw, {
  initialData,
  validateEmbeddable: (link) => localEmbedURL(link, location.origin) ? true : undefined,
  renderEmbeddable: (element) => {
    const src = localEmbedURL(element.link, location.origin);
    if (!src) return null;
    return React.createElement("iframe", {
      src, title: "Local HTML prototype", className: "excalidraw__embeddable",
      sandbox: "allow-scripts", referrerPolicy: "no-referrer",
      style: { width: "100%", height: "100%", border: 0 },
    });
  },
  renderTopRightUI: () => React.createElement(TopRightUI),
  excalidrawAPI: (a) => { api = a; window.excalidrawAPI = a; savedSnapshot = snap(initialData.elements || []); document.title = "excalibridge · " + file; refreshMtime(); refreshServerPending(); },
  onChange: () => { if (!api) return; const n = window.unsavedChanges().count; if (n > 0) scheduleAutosave(); renderSendState(); },
}));
</script>
</body>
</html>
